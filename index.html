<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - TikTok Tidak Ditemukan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #010101;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            max-width: 500px;
            width: 100%;
            z-index: 2;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
            background: linear-repeat(to right, #00f2fe, #4facfe);
            text-shadow: 3px 3px 0px #fe2c55, -3px -3px 0px #25f4ee;
            animation: glitch 1.5s infinite alternate;
        }
        .icon-container {
            margin: 20px auto;
            position: relative;
            width: 80px;
            height: 80px;
            background: #121212;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #fe2c55;
        }
        .icon-container::after {
            content: '✕';
            color: #fe2c55;
            font-size: 40px;
            font-weight: bold;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        p {
            font-size: 16px;
            color: #a9a9a9;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .highlight {
            color: #fe2c55;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 244, 238, 0.4);
            background: #25f4ee;
            color: #000000;
        }
        @keyframes glitch {
            0% { text-shadow: 3px 3px 0px #fe2c55, -3px -3px 0px #25f4ee; }
            50% { text-shadow: -2px 3px 0px #fe2c55, 3px -2px 0px #25f4ee; }
            100% { text-shadow: 3px -3px 0px #fe2c55, -3px 3px 0px #25f4ee; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <div class="icon-container"></div>
        <h1>Akun TikTok Tidak Ditemukan</h1>
        <p>Halo teman-teman! Lewat halaman ini saya ingin mengonfirmasi bahwa saat ini <span class="highlight">saya TIDAK memiliki atau menggunakan akun TikTok resmi</span>. <br><br>Jika ada akun yang mengatasnamakan saya di TikTok, itu adalah akun tiruan/palsu. Harap berhati-hati ya!</p>
        <a href="#" class="btn">Kembali ke Profil Utama</a>
    </div>
</body>
</html>
